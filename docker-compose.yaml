version: '3.8'

services:
  #База данных
  postgres-db:
    image: postgres:17.6-bookworm
    container_name: postgres-database-dev
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app_network_dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  #BACKEND
  backend:
    build:
        context: ./backend
        dockerfile: Dockerfile
    container_name: fastapi-backend-dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      # На Windows-хосте события файловой системы не доходят до контейнера через
      # bind-mount — заставляем reloader следить опросом, иначе нет хот-релоада.
      - WATCHFILES_FORCE_POLLING=true
    expose:
      - "8000" # Порт для nginx
    volumes:
      # Монтируем код
      - ./backend:/app
      # Монтируем статику (backend/static/)
      - ./backend/static:/app/static:ro
      - ./backend/static/employees:/app/static/employees:rw
    depends_on:
      postgres-db:
        condition: service_healthy  # Ждем, пока БД запустится
    networks:
      - app_network_dev
    restart: unless-stopped

  #FRONTEND
  frontend:
    build:
        context: ./frontend
        dockerfile: Dockerfile
    container_name: vite-frontend-dev
    command: npx vite --host
    env_file: ./frontend/.env
    environment:
      # Порт, на который браузер открывает websocket HMR (внешний порт nginx)
      - VITE_HMR_CLIENT_PORT=80
    expose:
      - "5173" # Порт для nginx
    volumes:
      # Монтируем код для хот-релоада
      - ./frontend:/app
      # Изолируем node_modules контейнера от хоста
      - frontend_node_modules:/app/node_modules
    networks:
      - app_network_dev
    restart: unless-stopped

  #NGINX
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy-dev
    ports:
      - "80:80"    # HTTP
      - "443:443"  # HTTPS (опционально)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Монтируем ТУ ЖЕ статику, что и для backend
      - ./backend/static:/static-files:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network_dev
    restart: unless-stopped

volumes:
  postgres_data_dev:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  app_network_dev:
    driver: bridge