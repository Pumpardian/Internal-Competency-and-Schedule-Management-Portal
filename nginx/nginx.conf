events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

	client_max_body_size 10M;

    upstream fastapi_backend {
        # 'backend' — это имя сервиса из docker-compose.yml
        # '8000' — порт, на котором работает uvicorn внутри контейнера
        server backend:8000;
    }

    upstream vite_frontend {
        # 'frontend' — имя сервиса из docker-compose, '5173' — порт Vite
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost;

		# 1. Статика (фото сотрудников) отдаётся nginx напрямую
		location /static/ {
			alias /static-files/;
			expires 30d;
			add_header Cache-Control "public, no-transform";
		}

        # 2. API и документация — на FastAPI
        location ~ ^/(api|docs|redoc|openapi.json) {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Всё остальное — на dev-сервер Vite (с проксированием websocket HMR)
        location / {
            proxy_pass http://vite_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}