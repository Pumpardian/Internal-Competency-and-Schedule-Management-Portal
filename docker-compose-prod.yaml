# Отдельное имя проекта, чтобы образы/тома/контейнеры прод-стека не
# пересекались с dev (docker-compose-dev.yaml).
name: portal-prod

services:
  # База данных
  postgres-db:
    image: postgres:17.6-bookworm
    container_name: postgres-database
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # BACKEND (без хот-релоада)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fastapi-backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
    expose:
      - "8000"
    volumes:
      # Загруженные фото переживают пересоздание контейнера и видны nginx
      - static_data:/app/static
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  # FRONTEND: nginx отдаёт собранную статику и проксирует API
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: nginx-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Та же статика, что пишет backend
      - static_data:/static-files:ro
    depends_on:
      - backend
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  static_data:
    driver: local

networks:
  app_network:
    driver: bridge
