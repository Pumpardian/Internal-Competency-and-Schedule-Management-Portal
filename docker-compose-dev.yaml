version: '3.8'

services:
  #База данных
  postgres-db:
    image: postgres:17.6-bookworm
    container_name: postgres-database-dev
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app_network_dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  #BACKEND
  backend:
    build:
        context: ./backend
        dockerfile: Dockerfile.dev
    container_name: fastapi-backend-dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
    expose:
      - "8000" # Порт для nginx
    volumes:
      # Монтируем код
      - ./backend:/app
      # Монтируем статику (backend/static/)
      - ./backend/static:/app/static:ro
      - ./backend/static/employees:/app/static/employees:rw
    depends_on:
      postgres-db:
        condition: service_healthy  # Ждем, пока БД запустится
    networks:
      - app_network_dev
    restart: unless-stopped

  #NGINX
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy-dev
    ports:
      - "80:80"    # HTTP
      - "443:443"  # HTTPS (опционально)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Монтируем ТУ ЖЕ статику, что и для backend
      - ./backend/static:/static-files:ro
    depends_on:
      - backend
    networks:
      - app_network_dev
    restart: unless-stopped

volumes:
  postgres_data_dev:
    driver: local

networks:
  app_network_dev:
    driver: bridge